<h2>选词气泡设计</h2>
<p class="subtitle">在任意翻译文本上选中单词/词组，紧贴选区弹出释义气泡</p>

<div class="mockup" style="margin: 12px auto; max-width: 500px;">
  <div class="mockup-body" style="padding: 20px; background: #f9fafb; border-radius: 8px; position: relative;">
    <!-- 句子 -->
    <div style="font-size: 14px; line-height: 1.8; color: #374151;">
      Today I <span style="background: #fef08a; border-radius: 3px; padding: 0 2px;">discussed</span> a rather tricky project <span style="background: #fef08a; border-radius: 3px; padding: 0 2px;">issue</span> with my colleagues.
    </div>
    <!-- 气泡 -->
    <div style="position: absolute; bottom: calc(100% + 8px); left: 20px; background: white; border: 1px solid #e5e7eb; border-radius: 10px; padding: 12px 14px; box-shadow: 0 4px 16px rgba(0,0,0,0.12); min-width: 200px; z-index: 10;">
      <!-- 小三角箭头 -->
      <div style="position: absolute; bottom: -6px; left: 16px; width: 10px; height: 10px; background: white; border-right: 1px solid #e5e7eb; border-bottom: 1px solid #e5e7eb; transform: rotate(45deg);"></div>
      <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 6px;">
        <span style="font-size: 15px; font-weight: 600; color: #1f2937;">discussed</span>
        <span style="font-size: 12px; color: #9ca3af;">/dɪˈskʌst/</span>
      </div>
      <div style="font-size: 12px; color: #6b7280; margin-bottom: 8px;">v. 讨论，谈论</div>
      <div style="display: flex; gap: 6px;">
        <button style="font-size: 11px; padding: 4px 10px; background: #f3f4f6; border: none; border-radius: 4px; cursor: pointer;">🔊 发音</button>
        <button style="font-size: 11px; padding: 4px 10px; background: #fef3c7; border: 1px solid #fcd34d; border-radius: 4px; cursor: pointer;">⭐ 收藏</button>
      </div>
    </div>
  </div>
</div>

<p class="subtitle" style="margin-top: 16px;">设计要点：</p>
<ul style="font-size: 13px; color: #6b7280; line-height: 1.8; padding-left: 20px;">
  <li>气泡紧贴选中文本下方，小三角指向词语</li>
  <li>显示：单词/词组 + 音标 + 释义 + 发音按钮 + 收藏按钮</li>
  <li>点击气泡外区域自动关闭</li>
  <li>多词词组（如 "rather tricky"）作为一个整体查询</li>
  <li>选中文本高亮为黄色作为视觉反馈</li>
</ul>
