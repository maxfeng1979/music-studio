<h2>写作页 — 最终版</h2>
<p class="subtitle">标题居中 · 按钮居中 · 日记语言/目标语言下拉</p>

<div class="mockup" style="margin-top: 12px;">
  <div class="mockup-body" style="padding: 20px; display: flex; flex-direction: column; gap: 12px; max-height: 480px;">

    <!-- 导航栏：标题居中 -->
    <div style="display: flex; align-items: center; padding: 4px 0;">
      <div style="flex: 1;"></div>
      <div style="font-size: 16px; font-weight: 600; color: #1f2937; letter-spacing: 0.5px;">LinguaLog</div>
      <div style="flex: 1; display: flex; justify-content: flex-end; gap: 8px;">
        <span style="font-size: 12px; color: #9ca3af; cursor: pointer;">📁</span>
        <span style="font-size: 12px; color: #9ca3af; cursor: pointer;">⚙️</span>
      </div>
    </div>

    <!-- 语言选择：日记语言 + 目标语言 -->
    <div style="display: flex; align-items: center; gap: 10px; justify-content: center; flex-wrap: wrap;">
      <div style="display: flex; align-items: center; gap: 4px;">
        <span style="font-size: 13px; color: #6b7280;">日记语言</span>
        <select style="font-size: 12px; padding: 5px 10px; border: 1px solid #e5e7eb; border-radius: 8px; background: white; cursor: pointer;">
          <option selected>中文</option>
          <option>English</option>
          <option>Français</option>
          <option>Italiano</option>
          <option>Español</option>
          <option>Deutsch</option>
          <option>日本語</option>
          <option>한국어</option>
        </select>
      </div>

      <div style="font-size: 16px; color: #d1d5db;">→</div>

      <div style="display: flex; align-items: center; gap: 4px;">
        <span style="font-size: 13px; color: #6b7280;">目标语言</span>
        <select style="font-size: 12px; padding: 5px 10px; border: 1px solid #3b82f6; border-radius: 8px; background: #eff6ff; color: #3b82f6; font-weight: 500; cursor: pointer;">
          <option selected>English</option>
          <option>中文</option>
          <option>Français</option>
          <option>Italiano</option>
          <option>Español</option>
          <option>Deutsch</option>
          <option>日本語</option>
          <option>한국어</option>
        </select>
      </div>
    </div>

    <!-- 文本输入区 -->
    <div style="flex: 1;">
      <textarea placeholder="写下今天发生的事情..." style="width: 100%; height: 100%; min-height: 260px; padding: 16px; font-size: 14px; line-height: 1.8; color: #374151; border: 1px solid #e5e7eb; border-radius: 12px; resize: none; outline: none; box-sizing: border-box; font-family: inherit; background: white;">今天和同事讨论了一个很棘手的项目问题，
我们花了两小时才理清思路。
最终找到了一致认可的解决方案。</textarea>
    </div>

    <!-- 提交按钮：居中 -->
    <div style="display: flex; justify-content: center;">
      <button style="padding: 10px 32px; background: #3b82f6; color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; box-shadow: 0 2px 8px rgba(59,130,246,0.3);">
        提交 →
      </button>
    </div>

  </div>
</div>
