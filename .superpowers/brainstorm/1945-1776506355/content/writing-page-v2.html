<h2>写作页 — 更新版</h2>
<p class="subtitle">标题居中 · 按钮居中 · 加宽布局 · 多语言支持</p>

<div class="mockup" style="margin-top: 12px;">
  <div class="mockup-body" style="padding: 20px; display: flex; flex-direction: column; gap: 12px; max-height: 480px;">

    <!-- 导航栏：标题居中 -->
    <div style="display: flex; align-items: center; padding: 4px 0;">
      <div style="flex: 1;"></div>
      <div style="font-size: 16px; font-weight: 600; color: #1f2937; letter-spacing: 0.5px;">LinguaLog</div>
      <div style="flex: 1; display: flex; justify-content: flex-end; gap: 8px;">
        <span style="font-size: 12px; color: #9ca3af; cursor: pointer;">📁</span>
        <span style="font-size: 12px; color: #9ca3af; cursor: pointer;">⚙️</span>
      </div>
    </div>

    <!-- 语言选择：源语言 + 目标语言 -->
    <div style="display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;">
      <div style="display: flex; align-items: center; gap: 4px;">
        <span style="font-size: 12px; color: #9ca3af;">源语言</span>
        <select style="font-size: 12px; padding: 4px 8px; border: 1px solid #e5e7eb; border-radius: 6px; background: white; cursor: pointer;">
          <option>中文</option>
          <option>English</option>
          <option>Français</option>
          <option>Italiano</option>
          <option>Español</option>
          <option>Deutsch</option>
          <option>日本語</option>
          <option>한국어</option>
        </select>
      </div>
      <div style="display: flex; align-items: center; gap: 4px;">
        <span style="font-size: 12px; color: #9ca3af;">→</span>
        <span style="font-size: 12px; color: #9ca3af;">目标语言</span>
        <select style="font-size: 12px; padding: 4px 8px; border: 1px solid #3b82f6; border-radius: 6px; background: #eff6ff; color: #3b82f6; font-weight: 500; cursor: pointer;">
          <option>English</option>
          <option>中文</option>
          <option>Français</option>
          <option>Italiano</option>
          <option>Español</option>
          <option>Deutsch</option>
          <option>日本語</option>
          <option>한국어</option>
        </select>
      </div>
    </div>

    <!-- 文本输入区：加宽 -->
    <div style="flex: 1;">
      <textarea placeholder="Write what happened today..." style="width: 100%; height: 100%; min-height: 260px; padding: 16px; font-size: 14px; line-height: 1.8; color: #374151; border: 1px solid #e5e7eb; border-radius: 12px; resize: none; outline: none; box-sizing: border-box; font-family: inherit; background: white;">Today I discussed a tricky project issue with my colleagues. It took us two hours to sort things out, but we finally found a solution that everyone agreed on.</textarea>
    </div>

    <!-- 提交按钮：居中 -->
    <div style="display: flex; justify-content: center;">
      <button style="padding: 10px 32px; background: #3b82f6; color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; box-shadow: 0 2px 8px rgba(59,130,246,0.3);">
        提交 →
      </button>
    </div>

  </div>
</div>

<p class="subtitle" style="margin-top: 10px;">更新说明：</p>
<ul style="font-size: 12px; color: #6b7280; line-height: 1.8; padding-left: 20px;">
  <li>标题居中，靠右放置历史(📁)和设置(⚙️)按钮</li>
  <li>源语言/目标语言改为下拉选择器，支持 8 种语言</li>
  <li>文本框加宽，占满容器宽度</li>
  <li>提交按钮居中显示</li>
</ul>
